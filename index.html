<div class="service-intro"><p class="eyebrow">Technical &amp; specialist recruitment</p><h1>Every technical discipline.<br>One recruitment partner.</h1><p class="service-lead">MEP, EPC, turbomachinery and the full oil &amp; gas value chain. We recruit the engineers, project teams, field specialists and skilled trades who design, build, commission, operate and maintain complex assets.</p><p class="technical-clients">Operators · EPC contractors · OEMs · Consultancies · Service companies · Workshops · Equipment businesses</p>
</div><div class="technical-top"><div><h2>Find your discipline</h2><p>Explore the equipment, project stages and roles we cover.</p></div><a class="button" href="#contact" data-contact>Discuss your requirement ↗</a></div>
<div class="discipline-grid">
<details class="discipline" name="technical-discipline"><summary>MEP &amp; building services</summary><p>Mechanical, electrical and plumbing engineering for construction, fit-out and building-services projects.</p><ul><li>MEP engineers and discipline leads</li><li>Design, site and interface engineers</li><li>BIM, CAD and technical coordination</li><li>Testing, commissioning, QA/QC and site supervision</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>EPC, engineering &amp; construction</summary><p>From bids and front-end engineering through procurement, construction and handover.</p><ul><li>Project directors, engineering managers and discipline leads</li><li>FEED, process, mechanical, piping, civil, structural and geotechnical engineering</li><li>Primavera P6 planning, cost control, QS, contracts and claims</li><li>Construction managers, superintendents, site engineers and document control</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Turbomachinery &amp; rotating equipment</summary><p>Gas and steam turbines, compressors, pumps, generators, drives and auxiliary systems.</p><ul><li>Rotating equipment, rotordynamics and performance engineers</li><li>Field service engineers and technical field advisors</li><li>Overhaul, alignment, balancing and vibration specialists</li><li>Controls, seals, bearings, aftermarket and service-centre roles</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Static equipment, piping &amp; facilities</summary><p>Technical hiring for process facilities, pipelines, tanks, terminals and associated equipment.</p><ul><li>Static equipment and mechanical engineers</li><li>Piping, stress, pipeline and facilities engineers</li><li>Welding, fabrication, pigging and cathodic protection</li><li>Tank, terminal, integrity and maintenance specialists</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Subsea, offshore &amp; marine</summary><p>Subsea installation, offshore operations and marine technical support.</p><ul><li>Subsea project and installation engineers</li><li>SURF, umbilicals, pipelines, risers and flow assurance</li><li>ROV pilots and supervisors, diving and mooring specialists</li><li>Offshore installation managers and marine engineers</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Drilling, wells &amp; production</summary><p>Upstream roles across drilling, completions, well intervention and production.</p><ul><li>Drilling engineers, superintendents and wellsite supervisors</li><li>Toolpushers, drillers, MWD/LWD and mud logging</li><li>Completions, cementing, fishing and well integrity</li><li>Reservoir, petroleum and production engineers</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Process, refining &amp; LNG</summary><p>Operations and engineering across gas processing, LNG, refining and petrochemicals.</p><ul><li>Process engineers and production specialists</li><li>Operations supervisors and control-room operators</li><li>Production technicians and plant operations</li><li>Process safety and operational reliability</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Electrical, instrumentation &amp; controls</summary><p>Power, automation and control-system experience matched to the asset and application.</p><ul><li>HV/LV electrical engineers and technicians</li><li>Instrumentation and controls engineers</li><li>DCS, SCADA, PLC, automation and SIS specialists</li><li>Metering, telecoms, E&amp;I supervisors and field teams</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Inspection, integrity, QA/QC &amp; HSE</summary><p>Quality, safety and asset integrity roles assessed against the project’s specific requirements.</p><ul><li>QA/QC managers, engineers and inspectors</li><li>NDT Level II/III, API and CSWIP inspection roles</li><li>Corrosion, coatings, rope access and reliability</li><li>HSE, process safety, environmental and permit-to-work roles</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Commissioning, maintenance &amp; trades</summary><p>Field, workshop and site teams across start-up, repair, overhaul and ongoing maintenance.</p><ul><li>Commissioning, pre-commissioning, start-up and handover</li><li>Workshop managers, maintenance planners and supervisors</li><li>Machinists, turners, fitters, welders and fabricators</li><li>Mechanical and E&amp;I technicians, riggers and crane operators</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Heavy equipment &amp; machinery</summary><p>Recruitment for manufacturers, dealers, distributors, rental fleets and contractors.</p><ul><li>Earthmoving, road machinery, lifting and material handling</li><li>Diesel engines, hydraulics, diagnostics and field service</li><li>Workshop, parts, warranty and product-support roles</li><li>Equipment sales, dealer development, rental and fleet management</li></ul></details>
<details class="discipline" name="technical-discipline"><summary>Shipping &amp; maritime</summary><p>Technical, operational and commercial hiring for shipowners, operators and ship managers.</p><ul><li>Technical and marine superintendents, fleet and HSEQ roles</li><li>Newbuilding, dry-dock and naval architecture</li><li>Masters, chief engineers, ETOs and deck or engine officers</li><li>Crewing, chartering, operations and commercial support</li></ul></details>
</div>
<div class="technical-support"><h2>Beyond the technical team</h2><p>We also recruit the project, commercial and support functions around your operation: procurement, supply chain, contracts, sales, business development, finance, HR, administration and coordination.</p></div>
</section><section id="shutdown" class="shutdown"><div class="service-intro"><p class="eyebrow">Shutdown & turnaround hiring</p><h2 class="service-title">The right team.<br>Ready for your shutdown.</h2><p class="lead">Specialist recruitment for planned shutdowns, turnarounds, outages and maintenance campaigns.</p></div><div class="three-grid"><article class="panel"><span class="number">01</span><h3>Define the scope</h3><p>Agree the equipment, disciplines, headcount, site requirements, certifications and mobilisation dates.</p></article><article class="panel"><span class="number">02</span><h3>Build the team</h3><p>Identify supervisors, field specialists, technicians and skilled trades with relevant project and equipment experience.</p></article><article class="panel"><span class="number">03</span><h3>Coordinate readiness</h3><p>Confirm availability, documents and commercial terms, and support interviews and agreed mobilisation arrangements.</p></article></div><p class="muted">Delivery arrangements, employment responsibilities and site access are agreed for each assignment.</p><a class="button" href="#contact" data-contact>Discuss a shutdown requirement ↗</a></section></div></main>

<h2>Information and sources</h2><p>We receive names, contact details, CVs, employment history, qualifications, skills, location, work-authorisation information, availability, remuneration expectations and correspondence. Sources include your applications and emails, information you share in conversations, referrals and professional sources such as LinkedIn. We also create recruitment notes and records of your choices. Publicly available information does not mean you have applied or agreed to join our Executive Network.</p><p>Please omit passport or ID numbers, banking information, medical records and unrelated personal or family details from your initial CV. We will explain any later request for information needed for a particular assignment. Do not provide confidential employer documents or someone else’s CV without authority.</p>
<h2>Purposes and permissions</h2><p>We use relevant information to handle your enquiry or application, assess experience against a role, arrange agreed introductions and interviews, and maintain recruitment records. A job application is separate from optional future-opportunity consideration. General CV registration and joining the Executive Network are requests to be considered for future opportunities.</p><p>Where we rely on consent, we record your choice and you may withdraw it. Where a legal exception permits processing without consent, we must identify and record the applicable basis and purpose. We do not treat an old CV, a public profile or a referral as blanket consent for unrelated use or marketing.</p>
<h2>Software and human review</h2><p>Our team may use software, including AI-assisted tools, to extract CV details, suggest talent pools, compare evidence with a job description and prepare correspondence. These suggestions can be incomplete or incorrect. A recruiter reviews the evidence; we do not use this website to make solely automated hiring or rejection decisions. Ask us to correct information or review an assessment. We assess job-related experience and requirements, not unrelated personal characteristics.</p>
<h2>Who receives information</h2><p>Access is limited to authorised team members and service providers needed for hosting, email, security, backups and any enabled AI processing. Candidate information is not a public directory. Before sharing an executive’s identity or CV with an employer, we seek approval. For other candidate introductions, we explain the proposed opportunity and agree the submission with you. Employers receiving an authorised submission are responsible for their own subsequent processing.</p><p>We do not sell CVs or publish identifiable executive profiles. An anonymous profile may still reveal identity from distinctive details; any future browsing service will require a separate review and permission process before publication.</p>
<h2>Providers and international processing</h2><p>Recruitment correspondence uses Google Workspace/Gmail. Cloudflare Turnstile protects website forms when enabled. AI-assisted processing may involve OpenAI tools when configured. RydeQuest has confirmed that its website hosting is in the United Kingdom. The locations of the proposed candidate database, CV storage and backups must be confirmed separately. Email, security, AI processing and provider support may involve other countries. Provider details, contractual safeguards and applicable transfer requirements must be verified before a new provider receives candidate data. Contact us for the current recipient and transfer information relevant to your record.</p>
<h2>Retention</h2><p>We retain information only while needed for the stated recruitment purpose, your ongoing relationship with us, or applicable legal and recordkeeping obligations. We review inactive talent-pool records after 24 months without meaningful candidate contact to decide whether to renew permission, delete or anonymise them. This is a review point, not a statutory retention period. Role-specific applications are reviewed after the assignment ends. Placement and financial records may require longer retention. Restricted backups expire under the applicable backup schedule; deletion requests must also be accounted for if a backup is restored.</p>
<h2>Your rights and requests</h2><p>Depending on the applicable law and circumstances, you may request information about processing, access, correction, erasure, restriction or cessation of processing, transfer of eligible data, and review of automated processing. You may withdraw consent or stop future-opportunity contact. Withdrawal does not retrospectively invalidate lawful processing. Some information may need to be retained for a legal obligation or claim; we will explain any applicable exception.</p><p>Email <a href="mailto:info@rydequest.com?subject=Privacy%20request">info@rydequest.com</a>. We may ask for proportionate identity verification, preferably using your existing contact channel. Please do not send identity documents unless requested through an agreed secure method. We will explain the applicable response period and outcome. You may also complain to the competent UAE data-protection authority.</p>
<h2>Security and changes</h2><p>We use restricted staff access and private CV storage. No system can guarantee absolute security. Suspected misuse can be reported to the same email address. Material changes to purposes or permissions will be communicated as appropriate; a new notice does not itself create new consent. See our <a href="/cookies/">cookie notice</a> and <a href="/privacy-requests/">privacy request guide</a>.</p></article></main>

iption. Any future optional advisory service would require separate terms and a legal review; it must not be a condition for access to employment.</p><h2>Employer engagements</h2><p>An enquiry does not create a recruitment service contract. Scope, fees, taxes, payment, confidentiality, introduction terms, replacement or guarantee arrangements and responsibilities must be agreed in a separate written agreement. Shutdown hiring does not by itself mean RydeQuest is the employer, sponsor or manpower supplier; the permitted delivery arrangements must be agreed for the assignment.</p><h2>Acceptable use and ownership</h2><p>Use the site lawfully. Do not submit malware, impersonate another person, attempt unauthorised access, scrape confidential candidate data or upload information you are not entitled to share. You retain rights in your CV; you authorise its use only for the purposes explained in the privacy notice and your choices. Website branding and content belong to their respective owners. Client logos do not imply an open vacancy or endorsement of a particular candidate.</p><h2>Availability and responsibility</h2><p>We take reasonable care with the site but do not guarantee uninterrupted availability or that every listing remains current. External sites have their own terms and privacy practices. Nothing here excludes rights or liability that cannot lawfully be excluded.</p><h2>Applicable law and contact</h2><p>These website terms are governed by applicable UAE law. Disputes are subject to the competent courts as determined by applicable law, without limiting mandatory rights. Separate signed recruitment agreements may specify their own dispute arrangements. Raise questions or concerns with info@rydequest.com.</p></article></main>

<style>#rq-full-journey #rq-journey-message{padding:8px 0;min-height:28px}#rq-full-journey #rq-journey-screen{margin-top:8px}</style>
<script>
(()=>{
const root=document.getElementById('rq-full-journey');
const select=root.querySelector('#rq-journey-select');
const stage=root.querySelector('#rq-journey-screen');
const surface=stage.attachShadow({mode:'open'});
const message=root.querySelector('#rq-journey-message');
const assets=JSON.parse(root.querySelector('#rq-journey-assets').textContent);
const pages=[...root.querySelectorAll('template[data-url]')];
let index=0;
function note(text){message.textContent=text;}
function show(key,remember=true){
  const found=pages.findIndex(p=>p.id==='rq-journey-'+key);index=found<0?0:found;
  const page=pages[index];
  surface.replaceChildren(root.querySelector('#rq-journey-css').content.cloneNode(true),page.content.cloneNode(true));
  surface.querySelectorAll('[data-asset]').forEach(img=>img.src=assets[img.dataset.asset]);
  surface.querySelectorAll('a,button,summary,select').forEach(el=>el.classList.add('cursor-interaction'));
  surface.querySelectorAll('form').forEach(form=>form.noValidate=true);
  select.value=page.id.replace('rq-journey-','');
  root.querySelector('#rq-journey-prev').disabled=index===0;
  root.querySelector('#rq-journey-next').disabled=index===pages.length-1;
  note(page.dataset.team==='true'?'Private team workspace · fictional candidates and conversations':'Public website · sample roles and details for design review');
  if(remember&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{walkthroughPage:select.value},privateContent:{}}).catch(()=>{});
}
function navigate(href){
  if(href.startsWith('#')){
    const target=surface.querySelector(href);
    if(target){if(target.tagName==='DETAILS')target.open=true;target.scrollIntoView({block:'start',behavior:'instant'});}return;
  }
  const exact=pages.find(p=>p.dataset.url===href);
  if(exact){show(exact.id.replace('rq-journey-',''));return;}
  if(href.startsWith('/team/candidates/?pool=')){show('talent');const filter=surface.querySelector('select[name=pool]');if(filter)filter.value=href.split('=')[1];filterPeople();return;}
  if(href.startsWith('/team/candidates/')){show('candidate');note('Example candidate profile · fictional Alex Morgan is used for this walkthrough.');return;}
  if(href.startsWith('/team/inbox/')){show('reply');return;}
  if(href.startsWith('/team/jobs/')&&href.endsWith('/status/')){show('closing');return;}
  if(href.startsWith('/team/placements/')){show('placement');return;}
  if(href.startsWith('/team/jobs/')){show('post');return;}
  if(href.startsWith('/team/drafts/')){show('draft');return;}
  if(href.startsWith('/register/')){show('apply');note('Private registration · sample upload form. No files are sent in this walkthrough.');return;}
  if(href.startsWith('/jobs/')&&href.includes('/apply')){show('apply');return;}
  if(href.startsWith('/team/cvs/')){const text=surface.querySelector('.text-extract');if(text){text.open=true;text.scrollIntoView({block:'nearest'});}note('Demo CV only. In the live workspace this downloads the private original file.');return;}
  if(href==='/admin/'){note('Administration manages team accounts and advanced settings after deployment.');return;}
  note('Preview only. This link does not open an external service.');
}
function filterPeople(){
  const q=(surface.querySelector('input[name=q]')?.value||'').toLowerCase();
  const pool=surface.querySelector('select[name=pool]');
  const label=pool&&pool.value?pool.selectedOptions[0].textContent.toLowerCase():'';
  let visible=0;
  surface.querySelectorAll('.talent-table tbody tr').forEach(row=>{const text=[...row.cells].map(cell=>cell.innerText).join(' ').toLowerCase();row.hidden=!(text.includes(q)&&(!label||text.includes(label)));if(!row.hidden)visible++;});
  note(visible+' fictional profiles shown. Search and filters run within this preview.');
}
surface.addEventListener('click',e=>{
  const a=e.target.closest('a');if(a){e.preventDefault();navigate(a.getAttribute('href')||'');return;}
});
surface.addEventListener('submit',e=>{
  e.preventDefault();const form=e.target;const action=form.getAttribute('action')||'';
  if(form.classList.contains('talent-search')){filterPeople();return;}
  if(select.value==='login'){show('overview');return;}
  if(action.includes('/logout/')){show('login');return;}
  if(select.value==='apply'){show('overview');note('Demo journey: the CV has arrived in the team workspace. Review Alex Morgan in “Needs your attention”. No data was uploaded.');return;}
  if(action.includes('/contact/')){show('enquiries');note('Demo journey: the employer enquiry appears in your team workspace. Nothing was sent.');return;}
  if(action.includes('/export/')){note('Demo only: this is where the reviewed reply would be saved as a Gmail draft. No email was sent or saved.');return;}
  if(select.value==='post'){show('mandates');note('Demo only: the job would be saved here after validation.');return;}
  if(select.value==='draft'){show('reply');note('Demo only: draft editing is shown; the original sample remains unchanged.');return;}
  if(form.classList.contains('search')){note('Preview uses two fictional roles. The live page searches your published jobs.');return;}
  note('Demo only: this action is not saved. The deployed workspace performs it after staff authentication and validation.');
});
select.addEventListener('change',()=>show(select.value));
root.querySelector('#rq-journey-prev').addEventListener('click',()=>show(pages[Math.max(0,index-1)].id.replace('rq-journey-','')));
root.querySelector('#rq-journey-next').addEventListener('click',()=>show(pages[Math.min(pages.length-1,index+1)].id.replace('rq-journey-','')));
const saved=window.openai?.widgetState?.modelContent?.walkthroughPage||window.openai?.widgetState?.walkthroughPage;
show(saved||'home',false);
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;const page=s?.modelContent?.walkthroughPage||s?.walkthroughPage;if(page)show(page,false);});
})();
</script>
</body></html>
